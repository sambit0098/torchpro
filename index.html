<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Web Torch</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-off: radial-gradient(circle at center, #2b2b36, #0d0d12);
            --bg-on: radial-gradient(circle at center, #3a3a48, #1a1a24); /* আসল টর্চের সময় ডার্ক ব্যাকগ্রাউন্ড থাকবে */
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-color-off: #ffffff;
            --text-color-on: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-off);
            color: var(--text-color-off);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* যখন আসল টর্চ অন থাকবে, তখন বাটনের স্টাইল চেঞ্জ হবে */
        body.torch-active {
            background: var(--bg-on);
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
        }

        .status-container {
            position: absolute;
            top: 15%;
            padding: 12px 32px;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        body.torch-active .status-container {
            border-color: #5b92e5;
            color: #5b92e5;
            box-shadow: 0 0 15px rgba(91, 146, 229, 0.4);
        }

        .power-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.1), 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            outline: none;
            color: var(--text-color-off);
        }

        body.torch-active .power-btn {
            border-color: #5b92e5;
            color: #5b92e5;
            box-shadow: inset 0 0 30px rgba(91, 146, 229, 0.2), 0 0 40px rgba(91, 146, 229, 0.4);
        }

        .power-btn:active {
            transform: scale(0.95);
        }

        .power-btn svg {
            width: 60px;
            height: 60px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 90%;
            max-width: 350px;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            background: #1c1c24;
            color: white;
            border-radius: 24px;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-content h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .upi-box {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 20px;
        }

        .upi-box span {
            display: block;
            font-size: 0.8rem;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .upi-box h3 {
            font-size: 1rem;
            letter-spacing: 0.5px;
            color: #4cd137;
            word-wrap: break-word;
        }

        .utr-input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            text-align: center;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s ease;
        }

        .utr-input:focus {
            border: 1px solid #5b92e5;
        }

        .modal-btn {
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            color: white;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #5b92e5;
            box-shadow: 0 4px 15px rgba(91, 146, 229, 0.4);
        }

        .btn-primary:active {
            background: #4a7bc2;
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            background: #4a4a5a;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            opacity: 0.8;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div class="status-container glass" id="statusText">Torch OFF</div>
    
    <button class="power-btn" id="powerBtn">
        <svg viewBox="0 0 24 24">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
        </svg>
    </button>

    <div class="modal-overlay" id="paymentModal">
        <div class="modal-content">
            <h2>Pay Rs. 1.00 to Turn Off</h2>
            
            <div class="upi-box">
                <span>Pay to this UPI ID:</span>
                <h3>premiumtorch@airtel</h3>
            </div>

            <input type="text" id="utrInput" class="utr-input" placeholder="Enter 12-digit UTR / Txn ID" maxlength="12">
            
            <button class="modal-btn btn-primary" id="btnVerify">Verify Payment</button>
            <button class="modal-btn btn-secondary" id="btnCancel">Keep it ON</button>
        </div>
    </div>

    <script>
        // --- 1. Firebase Configuration & Initialization ---
        const firebaseConfig = {
            apiKey: "AIzaSyAIDjA5tsZj21ohV_pLbpTym-zV6deF_dI",
            authDomain: "premiumtorch-a6e43.firebaseapp.com",
            databaseURL: "https://premiumtorch-a6e43-default-rtdb.asia-southeast1.firebasedatabase.app", 
            projectId: "premiumtorch-a6e43",
            storageBucket: "premiumtorch-a6e43.firebasestorage.app",
            messagingSenderId: "355094891765",
            appId: "1:355094891765:web:c39761d02ce0a0de5e89bc",
            measurementId: "G-LPTXE3RNBM"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- 2. Hardware Torch Logic ---
        const powerBtn = document.getElementById('powerBtn');
        const statusText = document.getElementById('statusText');
        const paymentModal = document.getElementById('paymentModal');
        const btnVerify = document.getElementById('btnVerify');
        const btnCancel = document.getElementById('btnCancel');
        const utrInput = document.getElementById('utrInput');

        let isTorchOn = false;
        let videoStream = null;
        let videoTrack = null;

        async function turnTorchOn() {
            try {
                // ক্যামেরার পারমিশন নেওয়া হচ্ছে আসল টর্চ জ্বালানোর জন্য
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" } // পেছনের ক্যামেরা
                });
                
                videoTrack = videoStream.getVideoTracks()[0];
                const capabilities = videoTrack.getCapabilities();

                // চেক করা হচ্ছে ফোনে টর্চ সাপোর্ট করে কি না
                if (capabilities.torch) {
                    await videoTrack.applyConstraints({
                        advanced: [{ torch: true }]
                    });
                    
                    isTorchOn = true;
                    document.body.classList.add('torch-active');
                    statusText.innerText = 'Torch ON';
                } else {
                    alert("আপনার ডিভাইসের ব্রাউজারে হার্ডওয়্যার টর্চ সাপোর্ট করছে না!");
                    videoTrack.stop();
                }
            } catch (error) {
                console.error("Torch error:", error);
                alert("আসল টর্চ অন করতে হলে ক্যামেরার পারমিশন Allow করতে হবে!");
            }
        }

        function turnTorchOff() {
            // টর্চ এবং ক্যামেরা বন্ধ করা
            if (videoTrack) {
                videoTrack.applyConstraints({ advanced: [{ torch: false }] })
                    .then(() => {
                        videoTrack.stop();
                        videoStream = null;
                    })
                    .catch(err => console.error(err));
            }

            isTorchOn = false;
            document.body.classList.remove('torch-active');
            statusText.innerText = 'Torch OFF';
            paymentModal.classList.remove('active');
            utrInput.value = ''; 
            btnVerify.innerText = 'Verify Payment';
            btnVerify.disabled = false;
        }

        // --- 3. Button Events ---
        powerBtn.addEventListener('click', () => {
            if (!isTorchOn) {
                turnTorchOn();
            } else {
                paymentModal.classList.add('active'); 
            }
        });

        btnCancel.addEventListener('click', () => {
            paymentModal.classList.remove('active');
            utrInput.value = ''; 
        });

        // --- 4. Firebase UTR Verification Logic ---
        btnVerify.addEventListener('click', () => {
            const utrValue = utrInput.value.trim();
            
            if (utrValue.length >= 10) {
                btnVerify.innerText = "Verifying from Bank...";
                btnVerify.disabled = true;

                db.ref('verified_utrs/' + utrValue).once('value').then((snapshot) => {
                    if (snapshot.exists()) {
                        alert("Payment Verified Automatically!\nTxn ID: " + utrValue);
                        turnTorchOff();
                    } else {
                        alert("Payment not received yet or Invalid Txn ID!\nIf you just paid, please wait 1 minute and try again.");
                        btnVerify.innerText = "Verify Payment";
                        btnVerify.disabled = false;
                    }
                }).catch((error) => {
                    console.error(error);
                    alert("Database Error! Please check Firebase Database Rules.");
                    btnVerify.innerText = "Verify Payment";
                    btnVerify.disabled = false;
                });

            } else {
                alert("Please enter a valid 12-digit UTR / Txn ID!");
            }
        });
    </script>
</body>
</html>
