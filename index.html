<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Web Torch</title>
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        :root {
            --bg-off: radial-gradient(circle at center, #2b2b36, #0d0d12);
            --bg-on: #ffffff; /* স্ক্রিন টর্চের জন্য সাদা রং */
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-color-off: #ffffff;
            --text-color-on: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-off);
            color: var(--text-color-off);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* যখন টর্চ অন থাকবে (Screen Torch) */
        body.torch-active {
            background: var(--bg-on);
            color: var(--text-color-on);
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
        }

        body.torch-active .glass {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: none;
        }

        .status-container {
            position: absolute;
            top: 15%;
            padding: 12px 32px;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .power-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.1), 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            outline: none;
            color: var(--text-color-off);
        }

        body.torch-active .power-btn {
            background: rgba(0, 0, 0, 0.1);
            border-color: rgba(0, 0, 0, 0.2);
            color: var(--text-color-on);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.1);
        }

        .power-btn:active {
            transform: scale(0.95);
        }

        .power-btn svg {
            width: 60px;
            height: 60px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 90%;
            max-width: 350px;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            background: #1c1c24; /* ডার্ক মোডাল */
            color: white;
            border-radius: 24px;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-content h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .modal-btn {
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            color: white;
            transition: background 0.2s ease;
        }

        .btn-primary {
            background: #5b92e5;
            box-shadow: 0 4px 15px rgba(91, 146, 229, 0.4);
        }

        .btn-primary:active {
            background: #4a7bc2;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            opacity: 0.8;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div class="status-container glass" id="statusText">Torch OFF</div>
    
    <button class="power-btn" id="powerBtn">
        <svg viewBox="0 0 24 24">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
        </svg>
    </button>

    <div class="modal-overlay" id="paymentModal">
        <div class="modal-content">
            <h2>Pay Rs. 1.00 to Turn Off</h2>
            <p style="font-size: 0.9rem; opacity: 0.7; margin-bottom: 20px;">
                Secure payment via Razorpay to turn off the screen torch.
            </p>
            
            <button class="modal-btn btn-primary" id="btnPaid">Pay with Razorpay</button>
            <button class="modal-btn btn-secondary" id="btnCancel">Keep it ON</button>
        </div>
    </div>

    <script>
        const powerBtn = document.getElementById('powerBtn');
        const statusText = document.getElementById('statusText');
        const paymentModal = document.getElementById('paymentModal');
        const btnPaid = document.getElementById('btnPaid');
        const btnCancel = document.getElementById('btnCancel');

        let isTorchOn = false;

        // -----------------------------------------------------
        // 1. Torch Logic (Screen Torch)
        // -----------------------------------------------------
        function turnTorchOn() {
            isTorchOn = true;
            document.body.classList.add('torch-active');
            statusText.innerText = 'Torch ON';
            
            // ফুলস্ক্রিন করার চেষ্টা (ঐচ্ছিক, ভালো স্ক্রিন টর্চ অভিজ্ঞতার জন্য)
            try {
                if(document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                }
            } catch(e) {}
        }

        function turnTorchOff() {
            isTorchOn = false;
            document.body.classList.remove('torch-active');
            statusText.innerText = 'Torch OFF';
            paymentModal.classList.remove('active');
            
            // ফুলস্ক্রিন থেকে বের হওয়া
            try {
                if(document.exitFullscreen) {
                    document.exitFullscreen();
                }
            } catch(e) {}
        }

        // -----------------------------------------------------
        // 2. Razorpay Integration
        // -----------------------------------------------------
        var options = {
            "key": "rzp_test_YOUR_KEY_HERE", // এখানে আপনার Razorpay Test Key বসাবেন
            "amount": "100", // 100 পয়সা = 1 টাকা
            "currency": "INR",
            "name": "Premium Torch",
            "description": "Torch Off Fee",
            "handler": function (response) {
                // পেমেন্ট সফল হলে এই ফাংশনটি চলবে
                alert("Payment Successful! Payment ID: " + response.razorpay_payment_id);
                turnTorchOff();
            },
            "prefill": {
                "name": "Sambit Ghosh",
                "email": "sambit@example.com",
                "contact": "9000000000"
            },
            "theme": {
                "color": "#5b92e5"
            }
        };

        var rzp1 = new Razorpay(options);
        
        // পেমেন্ট ফেইল হলে এলার্ট দেখাবে
        rzp1.on('payment.failed', function (response){
            alert("Payment Failed! Reason: " + response.error.description);
        });

        // -----------------------------------------------------
        // 3. Button Click Events
        // -----------------------------------------------------
        powerBtn.addEventListener('click', () => {
            if (!isTorchOn) {
                turnTorchOn();
            } else {
                paymentModal.classList.add('active'); // টর্চ অফ করতে চাইলে মোডাল আসবে
            }
        });

        btnCancel.addEventListener('click', () => {
            paymentModal.classList.remove('active');
        });

        btnPaid.addEventListener('click', () => {
            rzp1.open(); // Razorpay পপ-আপ ওপেন হবে
        });
    </script>
</body>
</html>
